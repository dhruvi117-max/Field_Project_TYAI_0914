name: Backend quality checks

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Compile Python source
        run: python -m compileall -q backend/app training
      - name: Run unit tests
        working-directory: backend
        run: python -m pytest tests -q
      - name: Check no real secrets were added
        run: |
          test ! -f backend/.env
          ! git ls-files | grep -E '(^|/)(models/.*\.(pt|onnx)|data/uploads/|data/audit_artifacts/)'
